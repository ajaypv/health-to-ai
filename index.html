<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Activity POC</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Health data</h1>
      <p id="status" class="muted">Starting…</p>

      <div class="row">
        <button id="connect" hidden>Connect Health Connect</button>
        <button id="refresh" class="secondary" hidden>Refresh</button>
        <button id="copy" class="secondary" hidden>Copy as JSON</button>
      </div>

      <div id="range" class="seg" hidden role="group" aria-label="Time range">
        <button data-days="1" aria-pressed="true">Today</button>
        <button data-days="7" aria-pressed="false">7 days</button>
        <button data-days="30" aria-pressed="false">30 days</button>
      </div>

      <div id="content"></div>

      <textarea id="json" hidden readonly rows="8" aria-label="JSON export"></textarea>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
